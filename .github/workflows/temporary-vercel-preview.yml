name: Temporary Vercel preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/initial-build

permissions:
  contents: read

concurrency:
  group: temporary-vercel-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the review branch
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Create anonymous temporary preview
        id: deploy
        shell: bash
        run: |
          preview_url="$(env -i HOME="${HOME}" PATH="${PATH}" TMPDIR="${RUNNER_TEMP}" npm_config_cache="${HOME}/.npm" npx --yes vercel@59.5.0 deploy --temporary --yes --no-color)"
          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "### Temporary Vercel preview" >> "${GITHUB_STEP_SUMMARY}"
          echo "${preview_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify public pages
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 "${PREVIEW_URL}/" > /dev/null
          curl --fail --silent --show-error --retry 5 "${PREVIEW_URL}/contact" > /dev/null
          echo "Verified ABOUT and CONTACT with HTTP success responses."
